[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotpotqa-multihop-rag"
version = "1.0.0"
description = "A reproducible comparison of dense, hybrid, and query-rewrite retrieval for HotpotQA"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fabian Arfire"}]
dependencies = [
  "datasets>=3.0",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "torch>=2.2",
  "transformers>=4.40",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
